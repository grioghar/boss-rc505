<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RC-505 Overlay</title>
<link rel="stylesheet" href="ring.css">
<style>
  /* Transparent page for an OBS browser source.
     Options: ?style=outline  ?scale=1.5  ?pos=top|bottom  ?align=left|center|right */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; color: #fff; }
  #dock { margin: auto auto 28px; transform-origin: bottom center; display: flex; flex-direction: column; align-items: center; gap: 10px; transition: opacity 0.4s; }
  body[data-pos="top"] #dock { margin: 28px auto auto; transform-origin: top center; flex-direction: column-reverse; }
  body[data-align="left"] #dock { margin-left: 28px; transform-origin: bottom left; align-items: flex-start; }
  body[data-align="right"] #dock { margin-right: 28px; transform-origin: bottom right; align-items: flex-end; }
  body.offline #dock { opacity: 0.35; }

  #toast {
    min-height: 30px; padding: 6px 16px; border-radius: 6px; background: var(--body); border: 1px solid #2a2b2f; border-left: 4px solid var(--strip);
    font-weight: 700; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase;
    opacity: 0; transform: translateY(8px); transition: opacity 0.25s, transform 0.25s; box-sizing: border-box;
  }
  #toast.show { opacity: 1; transform: none; }
  #toast .src { opacity: 0.55; font-weight: 600; margin-left: 8px; font-size: 11px; }

  #panel { display: flex; align-items: center; gap: 18px; padding: 16px 20px 14px; border-radius: 14px; background: linear-gradient(#1a1a1d, var(--body) 55%); border: 1px solid #2a2b2f; border-top: 4px solid var(--strip); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55); }
  #tracks { display: flex; gap: 14px; }
  .track { width: 78px; }
  #info { display: flex; }

  /* ?style=outline: nothing is filled, so the video behind shows through. Every part is
     drawn as an outline in its state colour; only the lit LED segments stay solid. */
  body[data-style="outline"] #panel { background: none; box-shadow: none; border: 1.5px solid rgba(255, 255, 255, 0.55); border-top: 3px solid var(--strip); }
  body[data-style="outline"] .lcd { background: none; box-shadow: none; border: 1.5px solid var(--lcd); }
  body[data-style="outline"] .lcd-cell { background: none; -webkit-mask-image: none; mask-image: none; text-shadow: 0 1px 2px #000, 0 0 5px rgba(0, 0, 0, 0.9); }
  body[data-style="outline"] #toast { background: none; border: 1.5px solid rgba(255, 255, 255, 0.55); border-left: 4px solid var(--strip); text-shadow: 0 1px 2px #000, 0 0 6px rgba(0, 0, 0, 0.9); }
  body[data-style="outline"] .track { --line: rgba(255, 255, 255, 0.5); }
  body[data-style="outline"] .track[data-state="stop"] { --line: #f2f2f4; }
  body[data-style="outline"] .track[data-state="play"] { --line: var(--play); }
  body[data-style="outline"] .track[data-state="rec"] { --line: var(--rec); }
  body[data-style="outline"] .track[data-state="overdub"] { --line: var(--dub); }
  body[data-style="outline"] .ring { filter: drop-shadow(0 0 1.5px rgba(0, 0, 0, 0.9)); }
  body[data-style="outline"] .ring-body { fill: none; stroke: rgba(255, 255, 255, 0.45); }
  body[data-style="outline"] .ring-leds-off { stroke: rgba(255, 70, 50, 0.22); }
  body[data-style="outline"] .ring-button { fill: none; stroke: var(--line); stroke-width: 3; filter: none; }
  body[data-style="outline"] .ring-glyph { fill: none; stroke: var(--line); stroke-width: 2.2; stroke-linejoin: round; }
  body[data-style="outline"] .track .label, body[data-style="outline"] .track .num { text-shadow: 0 1px 2px #000, 0 0 6px rgba(0, 0, 0, 0.9); }
</style>
</head>
<body class="offline">
<div id="dock">
  <div id="toast"></div>
  <div id="panel">
    <div id="info">
      <div id="lcd"></div>
    </div>
    <div id="tracks"></div>
  </div>
</div>
<script src="client.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  document.body.dataset.pos = q.get('pos') || 'bottom';
  document.body.dataset.align = q.get('align') || 'center';
  document.body.dataset.style = q.get('style') === 'outline' ? 'outline' : 'solid';
  document.getElementById('dock').style.transform = `scale(${Number(q.get('scale')) || 1})`;

  const LABEL = { empty: 'Empty', stop: 'Stopped', play: 'Play', rec: 'Rec', overdub: 'Dub' };
  const tracksEl = document.getElementById('tracks');
  tracksEl.innerHTML = [1, 2, 3, 4, 5].map((n) => `<div class="track" data-state="empty"><span class="num">${n}</span>${RCRing.svg(n)}<div class="label">Empty</div></div>`).join('');
  const els = [...tracksEl.children];
  const arcs = els.map((el) => el.querySelector('.ring-arc'));
  const lcd = document.getElementById('lcd');
  RCLcd.mount(lcd);
  let state = null;

  RC.on('link', (up) => { if (!up) document.body.classList.add('offline'); });
  RC.on('state', (s) => {
    state = s;
    document.body.classList.toggle('offline', !s.connected);
    RCLcd.render(lcd, s);
    s.tracks.forEach((t, i) => { els[i].dataset.state = t.state; els[i].querySelector('.label').textContent = LABEL[t.state]; });
  });

  function flash(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  let toastTimer;
  RC.on('press', (p) => {
    const m = p.id.match(/^t([1-5])\./);
    if (m) flash(els[m[1] - 1], 'hit');
    const toast = document.getElementById('toast');
    toast.innerHTML = '';
    toast.append(p.label);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
  });
  RC.on('beat', (b) => RCLcd.beat(lcd, b.n === 0));

  (function frame() {
    if (state) {
      const now = RC.serverNow();
      state.tracks.forEach((t, i) => {
        const p = RCRing.progress(t, now);
        arcs[i].style.strokeDasharray = p === null ? 'none' : `${p * RCRing.C} ${RCRing.C}`;
      });
    }
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
